name: Релиз

# По тегу v* собирает Windows и Linux и публикует ассеты в релизе:
# pereprava-<версия>-windows-amd64.exe, pereprava-<версия>-linux-amd64.tar.gz, SHA256SUMS.txt.
# Если релиз уже создан вручную (например, с готовыми заметками), ассеты прикрепляются к нему,
# иначе релиз создаётся автоматически со списком pull request'ов.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows (exe)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: Интерфейс
        run: npm ci && npm run build
        working-directory: app/frontend
      - name: Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
      - name: Сборка
        run: wails build -clean
      - name: Имя файла
        working-directory: .
        shell: bash
        run: cp app/build/bin/pereprava.exe "pereprava-${GITHUB_REF_NAME#v}-windows-amd64.exe"
      - uses: actions/upload-artifact@v5
        with:
          name: release-windows
          path: pereprava-*-windows-amd64.exe
          if-no-files-found: error

  linux:
    name: Linux (tar.gz)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: GTK и WebKitGTK для Wails
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgtk-3-dev libwebkit2gtk-4.1-dev >/dev/null
      - name: Интерфейс
        run: npm ci && npm run build
        working-directory: app/frontend
      - name: Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
      - name: Сборка
        run: wails build -clean -tags webkit2_41
      - name: Архив
        working-directory: .
        run: tar -czf "pereprava-${GITHUB_REF_NAME#v}-linux-amd64.tar.gz" -C app/build/bin pereprava
      - uses: actions/upload-artifact@v5
        with:
          name: release-linux
          path: pereprava-*-linux-amd64.tar.gz
          if-no-files-found: error

  publish:
    name: Публикация в релиз
    runs-on: ubuntu-latest
    needs: [windows, linux]
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          merge-multiple: true
      - name: SHA256SUMS
        run: sha256sum pereprava-*.exe pereprava-*.tar.gz > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Прикрепить к релизу (или создать)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber pereprava-*.exe pereprava-*.tar.gz SHA256SUMS.txt
          else
            gh release create "$GITHUB_REF_NAME" --title "Переправа $ver" --generate-notes \
              pereprava-*.exe pereprava-*.tar.gz SHA256SUMS.txt
          fi
