name: Тесты

on:
  push:
  pull_request:

jobs:
  scripts:
    name: Серверные скрипты (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    # Python берётся из официального образа, а не из раннера: у новых Ubuntu-раннеров
    # нет старых версий, а 3.9 — минимальная для exitctl (Python в Debian 11).
    container: python:${{ matrix.python }}-slim
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - name: openssl для тестов SNI
        run: apt-get update -qq && apt-get install -y -qq openssl >/dev/null
      - name: Синтаксис bash
        shell: bash
        run: for f in *.sh; do bash -n "$f"; done
      - name: Только LF в скриптах
        shell: bash
        run: |
          if grep -lI $'\r' exitctl *.sh; then echo "В этих файлах есть CR"; exit 1; fi
      - name: Тесты exitctl
        run: python tests/run_all.py

  app:
    name: Приложение (Go, Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum
      - name: Заглушка собранного интерфейса для go:embed
        shell: bash
        run: mkdir -p frontend/dist && echo '<!doctype html>' > frontend/dist/index.html
      - run: go vet ./...
      - run: go test ./... -count=1
